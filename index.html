<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Imagen Completa</title>
  <style>
    * { 
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden; /* Elimina las barras de desplazamiento */
    }

    img {
      width: 100vw;
      height: 100vh;
      object-fit: cover; /* Cubre toda la pantalla sin distorsionar */
      display: block;
    }
  </style>
</head>
<body>

  <img src="Practica-2_Unidad-2.png" alt="Imagen en pantalla completa">

</body>
</html>
